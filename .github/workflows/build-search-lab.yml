name: Build AURA Search Lab

# A small test app for the search part of the launcher: shows what each app's search provider answers (columns,
# covers) and several ways of opening a result. Published as the "aura-search-lab" pre-release.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-sh0pel]
    paths: ['search-lab/**', '.github/workflows/build-search-lab.yml']

permissions:
  contents: write

concurrency:
  group: build-search-lab
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        working-directory: search-lab
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
      - name: Sign with the AURA key and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir out
          "$BT/apksigner" sign --ks .github/aura-key/aura.p12 --ks-pass pass:auratv-public \
            --out out/aura-search-lab.apk "$(ls search-lab/app/build/outputs/apk/release/*.apk | head -1)"
          gh release delete aura-search-lab --cleanup-tag --yes || true
          gh release create aura-search-lab out/aura-search-lab.apk --prerelease --target "$GITHUB_SHA" \
            --title "AURA Search Lab" \
            --notes "Test bench for the launcher's search: raw provider answers, covers, ways of opening a result."
