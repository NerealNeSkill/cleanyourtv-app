name: Build AURA phone app

# Builds the phone app with the AURA launcher bundled instead of the upstream one, and publishes the
# APK as the "aura-app-latest" pre-release: install it on the phone, connect the phone to the TV, set up.
#
# The launcher comes from NerealNeSkill/cleanyourtv (branch below). It is signed with the key in the
# AURA_KEYSTORE_B64 and AURA_KEYSTORE_PASSWORD secrets, so later builds can update the TV's launcher in place.
# Without those secrets a one-off key is made for the run: fine for a first install, but a later build
# will have another signer and cannot replace the launcher already on the TV.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-sh0pel]

permissions:
  contents: write

env:
  LAUNCHER_REPO: NerealNeSkill/cleanyourtv
  LAUNCHER_REF: claude/project-thread-sh0pel
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.LAUNCHER_REPO }}
          ref: ${{ env.LAUNCHER_REF }}
          path: aura-src
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Signing key
        env:
          KS_B64: ${{ secrets.AURA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aura.p12"
            echo "AURA_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Using the key from the repository secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/aura.p12" -storetype PKCS12 -storepass "$pass" -alias aura \
              -keyalg RSA -keysize 3072 -validity 36500 -dname "CN=AURA TV launcher, O=aura"
            echo "AURA_KS_PASS=$pass" >> "$GITHUB_ENV"
            echo "::warning::No AURA_KEYSTORE secrets: signed with a one-off key, so this build cannot update a launcher already on the TV."
          fi
          echo "AURA_KS=$RUNNER_TEMP/aura.p12" >> "$GITHUB_ENV"

      - name: Build and sign the AURA launcher and the curtain
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          cp -R aura-src/launcher "$RUNNER_TEMP/launcher"
          rm -rf "$RUNNER_TEMP/launcher/.gradle" "$RUNNER_TEMP/launcher/app/build"
          sed -i -e '/^[[:space:]]*signingConfig[[:space:]]\{1,\}signingConfigs\.debug[[:space:]]*$/d' "$RUNNER_TEMP/launcher/app/build.gradle"
          echo "sdk.dir=$ANDROID_HOME" > "$RUNNER_TEMP/launcher/local.properties"
          (cd "$RUNNER_TEMP/launcher" && chmod +x gradlew && ./gradlew --no-daemon --console=plain assembleRelease -PlauncherApplicationId=com.gathin.tvhome)
          ./gradlew --no-daemon --console=plain :tv:curtain:assembleRelease
          ASSETS=android/platform/src/main/assets/bundled
          sign() { "$BT/apksigner" sign --ks "$AURA_KS" --ks-pass "pass:$AURA_KS_PASS" --v2-signing-enabled true --v3-signing-enabled true --out "$2" "$1"; }
          sign "$RUNNER_TEMP/launcher/app/build/outputs/apk/release/app-release-unsigned.apk" "$ASSETS/cleanyourtv-launcher.apk"
          sign tv/curtain/build/outputs/apk/release/curtain-release-unsigned.apk "$ASSETS/cleanyourtv-curtain.apk"
          signer() { "$BT/apksigner" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'; }
          echo "L_SIGNER=$(signer $ASSETS/cleanyourtv-launcher.apk)" >> "$GITHUB_ENV"
          echo "L_VCODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' aura-src/launcher/app/build.gradle | head -1)" >> "$GITHUB_ENV"
          echo "L_VNAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" aura-src/launcher/app/build.gradle | head -1)" >> "$GITHUB_ENV"
          echo "L_COMMIT=$(git -C aura-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Point the pins at these APKs
        run: |
          python3 - <<'PY'
          import hashlib, os, re
          pins = "core/trust/src/main/kotlin/tv/cleanyour/core/trust/Pins.kt"
          assets = "android/platform/src/main/assets/bundled/"
          text = open(pins, encoding="utf-8").read()
          def info(name):
              data = open(assets + name, "rb").read()
              return len(data), hashlib.sha256(data).hexdigest()
          def patch(obj, pairs):
              global text
              m = re.search(r"object %s \{.*?\n\}" % obj, text, re.S)
              block = m.group(0)
              for key, value in pairs.items():
                  block, n = re.subn(r"(const val %s = ).*" % key, lambda mm: mm.group(1) + value, block)
                  assert n == 1, (obj, key)
              text = text[:m.start()] + block + text[m.end():]
          size, sha = info("cleanyourtv-launcher.apk")
          signer = os.environ["L_SIGNER"]
          patch("PinnedLauncher", {
              "UPSTREAM_COMMIT": '"%s"' % os.environ["L_COMMIT"],
              "VERSION_CODE": "%sL" % os.environ["L_VCODE"],
              "VERSION_NAME": '"%s"' % os.environ["L_VNAME"],
              "SIZE": "{:_}L".format(size),
              "SHA256": '"%s"' % sha,
              "SIGNER_SHA256": '"%s"' % signer,
          })
          size, sha = info("cleanyourtv-curtain.apk")
          patch("PinnedCurtain", {"SIZE": "{:_}L".format(size), "SHA256": '"%s"' % sha})
          open(pins, "w", encoding="utf-8").write(text)
          PY
          git diff --stat core/trust

      - name: Pins and the phone app
        run: |
          ./gradlew --no-daemon --console=plain :core:trust:verifyLauncherPin :core:trust:verifyCurtainPin
          ./gradlew --no-daemon --console=plain :app:assembleFullDebug
          mkdir -p out
          cp "$(ls app/build/outputs/apk/full/debug/*.apk | head -1)" out/aura-tv-phone-app.apk
          ls -l out
          echo "phone app: $(( $(stat -c %s out/aura-tv-phone-app.apk) / 1024 )) KB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aura-tv-phone-app
          path: out/aura-tv-phone-app.apk

      - name: Publish pre-release aura-app-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aura-app-latest --cleanup-tag --yes || true
          gh release create aura-app-latest out/aura-tv-phone-app.apk --prerelease --target "$GITHUB_SHA" \
            --title "AURA phone app (latest build)" \
            --notes "Phone app with the AURA launcher (${L_COMMIT}) bundled. Debug-signed; install on the phone, then connect it to the TV."
